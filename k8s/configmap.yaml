apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  namespace: ml-training
data:
  training_config.yaml: |
    model:
      architecture: resnet18
      num_classes: 10
    training:
      epochs: 2
      batch_size: 128
      learning_rate: 0.001
      early_stopping_patience: 3
      log_interval: 2
      max_train_samples: 2000
      max_val_samples: 500
    data:
      dataset: cifar10
      data_dir: /app/data
    output:
      checkpoint_dir: /app/checkpoints
      model_name: classifier_v1.pt
