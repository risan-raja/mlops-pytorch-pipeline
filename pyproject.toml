[project]
name = "mlops-pytorch-pipeline"
version = "0.1.0"
description = "MLOps CIFAR-10 PyTorch Training and Serving Pipeline on Docker & Kubernetes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "torchvision",
    "pyyaml>=6.0.2",
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "pillow>=11.1.0",
    "pydantic>=2.10.4",
    "pytest>=8.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]
train = [
    "torch",
    "torchvision",
    "pyyaml>=6.0.2",
    "pytest>=8.3.4",
]
serve = [
    "torch",
    "torchvision",
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "pillow>=11.1.0",
    "pydantic>=2.10.4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
default-groups = ["dev", "train", "serve"]
