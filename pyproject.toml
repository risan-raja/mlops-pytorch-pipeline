[project]
name = "mlops-pytorch-pipeline"
version = "0.1.0"
description = "MLOps CIFAR-10 PyTorch Training and Serving Pipeline on Docker & Kubernetes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "pyyaml>=6.0.2",
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "pillow>=11.1.0",
    "pydantic>=2.10.4",
    "pytest>=8.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]
train = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "pyyaml>=6.0.2",
    "pytest>=8.3.4",
]
serve = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "pillow>=11.1.0",
    "pydantic>=2.10.4",
]

[tool.uv]
default-groups = ["dev", "train", "serve"]
